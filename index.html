<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr Manisha G. Kulthe</title>
<meta name="description" content="Dr Manisha G. Kulthe, Head of Metallurgy and Materials Engineering, COEP Technological University, Pune. Polymer nanocomposites, EMI shielding, coatings and metals processing.">
<meta property="og:title" content="Dr Manisha G. Kulthe">
<meta property="og:image" content="images/portrait.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: editorial asymmetric grid (side-heads left, content right), 1200px measure, hairline-divided sections.
   Copper is reserved for the conducting network, key figures and the portrait trace; verdigris carries links and controls. */
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --ink:#132326; --muted:#55696C; --rule:#D3DEDC; --tint:#E5EEEC;
  --verdigris:#1D7268; --copper:#B0602A; --on-accent:#FFFFFF; --shadow:rgba(19,35,38,.12); --scrim:rgba(8,16,18,.92);
  --photo-ground:#0B1416; --photo-scrim:rgba(6,12,14,.82); --on-photo:#F2F6F5; --on-photo-accent:#EFA86E; --crest-plate:#FFFFFF;
  --f-display:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,40px); --maxw:1200px;
  --t-xs:.78rem; --t-sm:.9rem; --t-md:1.0625rem; --t-lg:1.25rem; --t-h3:1.4rem; --t-h2:clamp(1.85rem,3.1vw,2.6rem);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1618; --surface:#132023; --ink:#E2ECEA; --muted:#93A9AB; --rule:#243739; --tint:#172A2D;
    --verdigris:#58C3B5; --copper:#E39A5E; --on-accent:#06191A; --shadow:rgba(0,0,0,.5); --scrim:rgba(3,8,9,.94);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1618; --surface:#132023; --ink:#E2ECEA; --muted:#93A9AB; --rule:#243739; --tint:#172A2D;
  --verdigris:#58C3B5; --copper:#E39A5E; --on-accent:#06191A; --shadow:rgba(0,0,0,.5); --scrim:rgba(3,8,9,.94);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-md)/1.65 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%}
a{color:var(--verdigris);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--ink)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px;border-radius:3px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.nav-in{display:flex;align-items:center;gap:14px;min-height:64px}
.mark{flex:none;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--ink);border-radius:50%;color:var(--ink);text-decoration:none;font:500 .82rem/1 var(--f-display);letter-spacing:.06em}
.mark:hover{border-color:var(--copper);color:var(--copper)}
.nav-name{min-width:0;display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.nav-name b{font:500 1.02rem/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-name span{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{list-style:none;display:flex;gap:2px;margin:0;padding:0}
.nav-links a{display:block;padding:8px 11px;border-radius:4px;color:var(--muted);text-decoration:none;font-size:var(--t-sm);font-weight:500}
.nav-links a:hover{color:var(--ink);background:var(--tint)}
.nav-links a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--copper);border-radius:0}
.icon-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--surface);border-radius:6px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}
@media (max-width:1080px){
  .menu-btn{display:grid}
  .nav-links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:6px var(--gutter) 12px}
  .nav-links.open{display:flex}
  .nav-links a{padding:13px 4px;border-bottom:1px solid var(--rule);border-radius:0}
  .nav-links a[aria-current="page"]{box-shadow:inset 3px 0 0 var(--copper);padding-left:12px}
}
@media (max-width:460px){.nav-name span{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--rule)}
.hero canvas.field{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.85fr);gap:clamp(36px,6vw,96px);align-items:center;padding-block:clamp(44px,7vw,104px)}
.role{display:flex;flex-direction:column;gap:2px;font-size:var(--t-sm);color:var(--muted)}
.role b{color:var(--ink);font-weight:600}
.name{margin-top:22px;font-size:clamp(2.9rem,7.4vw,5.8rem);line-height:.98;font-weight:400;letter-spacing:-.025em;font-variation-settings:"opsz" 72}
.name .pre{display:block;font-size:.32em;letter-spacing:.02em;color:var(--muted);margin-bottom:.35em;font-weight:400}
.name .ln{display:block}
.thesis{margin-top:26px;max-width:34em;font:400 clamp(1.12rem,1.6vw,1.32rem)/1.55 var(--f-display);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:4px;border:1px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;font-weight:500;font-size:var(--t-sm);cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--verdigris);border-color:var(--verdigris);color:var(--on-accent)}
.btn.solid:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:40px 0 0;border-top:1px solid var(--ink)}
.sheet div{padding:14px 14px 0 0}
.sheet div+div{padding-left:14px;border-left:1px solid var(--rule)}
.sheet dt{font-size:var(--t-xs);color:var(--muted);line-height:1.3}
.sheet dd{margin:6px 0 0;font:400 clamp(1.5rem,2.4vw,2rem)/1.1 var(--f-display);font-variant-numeric:tabular-nums lining-nums}
.sheet dd small{font:500 var(--t-xs) var(--f-mono);color:var(--muted);margin-left:4px;letter-spacing:0}
.sheet .hot dd{color:var(--copper)}
@media (max-width:620px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}.sheet div:nth-child(3){border-left:0;padding-left:0}.sheet div:nth-child(n+3){border-top:1px solid var(--rule);margin-top:14px}}

.portrait{position:relative;margin:0;justify-self:end;width:100%;max-width:400px}
.frame{position:relative}
.frame::before{content:"";position:absolute;inset:18px -18px -18px 18px;background:var(--tint);border-radius:2px}
.frame img,.frame .ph{position:relative;display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 18%;border-radius:2px;background:var(--tint)}
.frame .ph{display:grid;place-items:center;font:400 4rem var(--f-display);color:var(--muted)}
.trace{position:absolute;inset:-11px;pointer-events:none}
.trace i{position:absolute;background:var(--copper)}
.trace .t{top:0;left:0;right:0;height:1.5px;transform-origin:left}
.trace .r{top:0;right:0;bottom:0;width:1.5px;transform-origin:top}
.trace .b{bottom:0;left:0;right:0;height:1.5px;transform-origin:right}
.trace .l{top:0;left:0;bottom:0;width:1.5px;transform-origin:bottom}
.portrait figcaption{margin-top:30px;font-size:var(--t-sm);color:var(--muted);line-height:1.5;max-width:34em}
.fig{font:500 var(--t-xs) var(--f-mono);color:var(--verdigris);margin-right:8px;letter-spacing:.02em}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.portrait{justify-self:start;max-width:300px;order:-1}}
@media (max-width:520px){.portrait{max-width:240px}.trace{inset:-7px}.frame::before{inset:12px -12px -12px 12px}}

/* load choreography: one orchestrated moment */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes develop{from{opacity:0;filter:grayscale(1) contrast(.8)}to{opacity:1;filter:none}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.frame img{animation:develop 1.1s ease .15s both}
.trace .t{animation:grow-x .45s cubic-bezier(.6,0,.4,1) .55s both}
.trace .r{animation:grow-y .45s cubic-bezier(.6,0,.4,1) 1s both}
.trace .b{animation:grow-x .45s cubic-bezier(.6,0,.4,1) 1.45s both}
.trace .l{animation:grow-y .45s cubic-bezier(.6,0,.4,1) 1.9s both}
.page{animation:rise .45s ease both}
@media (prefers-reduced-motion:reduce){.rise,.frame img,.trace i,.page{animation:none}}

/* ---------- sections ---------- */
.section{padding-block:clamp(56px,8vw,104px)}
.section+.section{border-top:1px solid var(--rule)}
.side{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:clamp(24px,5vw,72px)}
.side>*{min-width:0}
.side-head h2{font-size:var(--t-h2)}
.side-head p{margin-top:12px;color:var(--muted);font-size:var(--t-sm);max-width:28em}
.page-head{padding-block:clamp(48px,7vw,88px) clamp(28px,4vw,44px);border-bottom:1px solid var(--rule)}
.page-head h1{font-size:clamp(2.4rem,5.4vw,4rem);font-weight:400;letter-spacing:-.02em}
.page-head p{margin-top:14px;max-width:40em;color:var(--muted);font-size:var(--t-lg);line-height:1.55}
@media (max-width:820px){.side{grid-template-columns:1fr}}
.page-head+.section{padding-top:clamp(28px,4vw,48px)}

.prose{max-width:38em;display:flex;flex-direction:column;gap:1.05em}
.prose p{font-size:1.08rem;line-height:1.75}
.prose p:first-child{font:400 1.3rem/1.6 var(--f-display)}

/* research areas */
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--rule)}
.area{padding:26px 26px 28px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px}
.area:nth-child(even){padding-left:26px;border-left:1px solid var(--rule)}
.area svg{width:44px;height:44px;color:var(--verdigris)}
.area h3{font-size:var(--t-h3)}
.area p{margin-top:8px;color:var(--muted);font-size:.98rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding:0;list-style:none}
.tags li{font:500 var(--t-xs) var(--f-mono);border:1px solid var(--rule);border-radius:3px;padding:3px 8px;color:var(--muted)}
@media (max-width:700px){.areas{grid-template-columns:1fr}.area:nth-child(even){padding-left:0;border-left:0}}

/* ---------- percolation explorer ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:0;border:1px solid var(--rule);background:var(--surface);border-radius:6px;overflow:hidden}
.lab>*{min-width:0}
.lab-stage{position:relative;padding:18px;border-right:1px solid var(--rule)}
.lab-stage canvas{display:block;width:100%;height:auto;aspect-ratio:628/380;border-radius:3px}
.stage-labels{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;margin-top:10px;font:500 var(--t-xs) var(--f-mono);color:var(--muted)}
.stage-labels .mid{text-align:center}
@media (max-width:520px){.stage-labels .mid{display:none}}
.lab-side{padding:20px;display:flex;flex-direction:column;gap:18px}
.readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.readout dt{font-size:var(--t-xs);color:var(--muted);line-height:1.3}
.readout dd{margin:4px 0 0;font:400 1.5rem/1.1 var(--f-display);font-variant-numeric:tabular-nums lining-nums}
.state{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 12px;border-radius:999px;font-size:var(--t-sm);font-weight:500;background:var(--tint);color:var(--muted);transition:background .3s,color .3s}
.state i{width:8px;height:8px;border-radius:50%;background:currentColor}
.state.on{background:color-mix(in srgb,var(--copper) 16%,transparent);color:var(--copper)}
.state.on i{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--copper) 0%,transparent),0 0 0 3px color-mix(in srgb,var(--copper) 35%,transparent)}}
.slider label{display:flex;justify-content:space-between;font-size:var(--t-sm);font-weight:500}
.slider label span{font-family:var(--f-mono);color:var(--copper)}
.slider input{width:100%;margin-top:10px;accent-color:var(--copper);height:26px;cursor:pointer}
.ctrl{display:flex;flex-wrap:wrap;gap:8px}
.ctrl .btn{padding:8px 14px}
.plot{width:100%;height:auto;display:block}
.plot .ax{stroke:var(--rule);stroke-width:1}
.plot .grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
.plot text{fill:var(--muted);font:400 10px var(--f-mono)}
.plot .curve{fill:none;stroke:var(--verdigris);stroke-width:2}
.plot .cond{fill:var(--copper);opacity:.08}
.plot .pc{stroke:var(--copper);stroke-width:1;stroke-dasharray:3 3}
.plot .pc-t{fill:var(--copper)}
.plot .dot{fill:var(--copper);stroke:var(--surface);stroke-width:2}
.lab-note{grid-column:1/-1;border-top:1px solid var(--rule);padding:16px 20px;font-size:var(--t-sm);color:var(--muted);line-height:1.6}
@media (max-width:900px){.lab{grid-template-columns:1fr}.lab-stage{border-right:0;border-bottom:1px solid var(--rule)}}
@media (max-width:420px){.readout{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- masthead ---------- */
.masthead{background:var(--surface);border-bottom:1px solid var(--rule)}
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:12px}
.mast-brand{display:flex;align-items:center;gap:14px;min-width:0;text-decoration:none;color:var(--ink)}
.mast-brand:hover{color:var(--ink)}
.logo-plate{flex:none;display:grid;place-items:center;background:var(--crest-plate);border-radius:6px;padding:4px 5px}
.logo-plate img{display:block;height:58px;width:auto}
.logo-plate.lg img{height:72px}
.mast-text{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.mast-text b{font:600 clamp(1.05rem,1.8vw,1.35rem)/1.2 var(--f-display);letter-spacing:-.005em}
.mast-text span{font-size:var(--t-xs);color:var(--muted);margin-top:3px}
.mast-dept{flex:none;max-width:16em;text-align:right;font:500 var(--t-sm)/1.35 var(--f-display);color:var(--verdigris)}
@media (max-width:760px){.mast-dept{display:none}.logo-plate img{height:46px}.mast-text span{display:none}}

/* ---------- moments banner ---------- */
.banner{position:relative;background:var(--photo-ground);color:var(--on-photo);isolation:isolate}
.b-stage{position:relative;height:clamp(280px,46vw,600px);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.slide.on{opacity:1}
.slide .bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);max-width:none;object-fit:cover;filter:blur(30px) saturate(1.15) brightness(.62)}
.slide .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.slide.tall .fg{object-fit:contain}
.slide.on .fg{animation:drift 9s ease-out both}
@keyframes drift{from{transform:scale(1.07)}to{transform:scale(1)}}
.slide.tall.on .fg{animation:none}
.b-stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,var(--photo-scrim) 0%,transparent 48%),linear-gradient(to bottom,rgba(0,0,0,.18),transparent 22%)}
.b-open{position:absolute;inset:0;z-index:1;border:0;background:transparent;cursor:zoom-in}
.b-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;pointer-events:none;padding-block:0 26px}
.b-cap-in{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.b-text{min-width:0;max-width:46em}
.b-tag{display:inline-block;font:500 var(--t-xs) var(--f-mono);letter-spacing:.04em;color:var(--on-photo-accent)}
.b-text p{margin-top:6px;font:400 clamp(1.08rem,2.1vw,1.6rem)/1.35 var(--f-display);text-wrap:balance;text-shadow:0 1px 18px rgba(0,0,0,.35);animation:rise .7s ease both}
.b-ctrl{flex:none;display:flex;align-items:center;gap:8px;pointer-events:auto}
.b-count{font:500 var(--t-xs) var(--f-mono);margin-right:6px;opacity:.85}
.b-ctrl button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(242,246,245,.38);background:rgba(10,18,20,.25);color:var(--on-photo);cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.b-ctrl button:hover{background:rgba(242,246,245,.16)}
.b-ctrl svg{width:18px;height:18px}
.b-all{margin-left:6px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid rgba(242,246,245,.38);color:var(--on-photo);text-decoration:none;font-size:var(--t-sm);font-weight:500;background:rgba(10,18,20,.25)}
.b-all:hover{color:var(--on-photo);background:rgba(242,246,245,.16)}
.b-all span{font:500 var(--t-xs) var(--f-mono);opacity:.8}
.b-prog{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:3px;height:3px}
.b-prog span{flex:1;background:rgba(242,246,245,.22);overflow:hidden}
.b-prog span.done{background:rgba(242,246,245,.6)}
.b-prog i{display:block;height:100%;background:var(--on-photo-accent);transform-origin:left;animation:grow-x 7s linear both}
.banner:hover .b-prog i,.banner:focus-within .b-prog i{animation-play-state:paused}
@media (max-width:640px){.b-stage{height:clamp(230px,66vw,340px)}.b-stage::after{background:linear-gradient(to bottom,rgba(0,0,0,.18),transparent 22%)}.b-cap{position:static;padding-block:14px 18px}.b-cap-in{flex-direction:column;align-items:stretch;gap:12px}.b-text p{text-shadow:none}.b-ctrl{justify-content:flex-start}.b-all{margin-left:auto}}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.on .fg,.b-text p{animation:none}}

/* ---------- publications ---------- */
.pubs{list-style:none;margin:0;padding:0}
.pub{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px;padding:20px 0;border-top:1px solid var(--rule)}
.pub .yr{font:400 1.25rem var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums lining-nums}
.pub h3{font-size:1.18rem;line-height:1.35;font-weight:500}
.pub .au{margin-top:6px;font-size:var(--t-sm);color:var(--muted)}
.pub .au b{color:var(--ink);font-weight:600}
.pub .jr{margin-top:4px;font-size:var(--t-sm);font-style:italic}
.pub .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font:500 var(--t-xs) var(--f-mono)}
.kind{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.kind i{width:8px;height:8px;border-radius:50%}
.k-Journal{background:var(--verdigris)}
.k-Conference{background:var(--copper)}
.k-Chapter{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
@media (max-width:520px){.pub{grid-template-columns:1fr;gap:4px}}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.search{position:relative;flex:1 1 260px;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;font-size:var(--t-sm)}
.search input:focus{outline:none;border-color:var(--verdigris)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);cursor:pointer;font-size:var(--t-sm);color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip small{font-family:var(--f-mono);margin-left:4px;opacity:.75}

.record{overflow-x:auto;margin-bottom:28px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:16px 16px 8px}
.record svg{display:block;min-width:560px;width:100%;height:auto}
.record .ax{stroke:var(--rule)}
.record text{fill:var(--muted);font:400 10px var(--f-mono)}
.record .col{fill:transparent;cursor:pointer}
.record .col:hover,.record .col.sel{fill:var(--tint)}
.record .d-Journal{fill:var(--verdigris)}
.record .d-Conference{fill:var(--copper)}
.record .d-Chapter{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.record-key{display:flex;flex-wrap:wrap;gap:16px;margin-top:6px;font:500 var(--t-xs) var(--f-mono);color:var(--muted)}
.empty{padding:40px 24px;text-align:center;border:1px dashed var(--rule);border-radius:6px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:500 1.2rem var(--f-display);margin-bottom:6px}

/* ---------- projects ---------- */
.funds{list-style:none;margin:0;padding:0}
.fund{padding:22px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px 24px;align-items:start}
.fund h3{font-size:1.2rem;line-height:1.35}
.fund .by{margin-top:6px;color:var(--muted);font-size:var(--t-sm)}
.fund .amt{text-align:right;font:400 1.6rem/1.1 var(--f-display);font-variant-numeric:tabular-nums lining-nums}
.fund .amt small{display:block;font:500 var(--t-xs) var(--f-mono);color:var(--muted);margin-top:4px}
.bar{grid-column:1/-1;height:6px;background:var(--tint);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verdigris);border-radius:3px}
.fund.on .bar i{background:var(--copper)}
.flag{display:inline-block;margin-left:8px;font:500 var(--t-xs) var(--f-mono);color:var(--copper);vertical-align:2px}
.flag.done{color:var(--muted)}
@media (max-width:560px){.fund{grid-template-columns:1fr}.fund .amt{text-align:left}}
.total{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.total b{font:400 clamp(2.4rem,5vw,3.4rem)/1 var(--f-display);color:var(--copper);font-variant-numeric:tabular-nums lining-nums}
.total span{color:var(--muted)}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--rule)}
.tl li{position:relative;padding:0 0 30px 34px}
.tl li::before{content:"";position:absolute;left:0;top:7px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:1.5px solid var(--verdigris)}
.tl li.now::before{background:var(--copper);border-color:var(--copper)}
.tl .when{font:500 var(--t-xs) var(--f-mono);color:var(--verdigris)}
.tl h3{margin-top:4px;font-size:1.22rem}
.tl p{margin-top:4px;color:var(--muted);font-size:.97rem}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,5vw,64px)}
.cols2>*{min-width:0}
.cols2 h2{font-size:1.6rem;margin-bottom:26px}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}

/* awards */
.awards{list-style:none;margin:0;padding:0}
.awards li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;padding:22px 0;border-top:1px solid var(--rule)}
.awards .when{font:400 1.2rem var(--f-display);color:var(--copper);font-variant-numeric:tabular-nums lining-nums}
.awards h3{font-size:1.3rem}
.awards p{margin-top:4px;color:var(--muted)}
.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0;border-top:1px solid var(--rule)}
.members div{padding:18px 18px 18px 0;border-bottom:1px solid var(--rule)}
.members b{display:block;font:500 1.08rem/1.3 var(--f-display)}
.members span{display:block;margin-top:4px;font-size:var(--t-sm);color:var(--muted)}
@media (max-width:520px){.awards li{grid-template-columns:1fr;gap:2px}}

/* gallery */
.masonry{columns:3 280px;column-gap:18px}
.tile{break-inside:avoid;margin:0 0 18px;cursor:zoom-in}
.tile img{display:block;width:100%;border-radius:3px;transition:transform .5s ease,filter .5s ease}
.tile:hover img{transform:scale(1.015)}
.tile figcaption{margin-top:8px;font-size:var(--t-sm);color:var(--muted);line-height:1.45}
.tile figcaption .fig{display:block;margin:0 0 2px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);color:#EEF3F2}
.lb-top{display:flex;justify-content:space-between;align-items:center;font:500 var(--t-xs) var(--f-mono)}
.lb-img{display:grid;place-items:center;min-height:0}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
.lb-cap{display:flex;gap:12px;align-items:center;justify-content:center;max-width:900px;margin:12px auto 0;text-align:center;font:400 1.05rem/1.5 var(--f-display)}
.lb button{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(238,243,242,.3);background:transparent;color:#EEF3F2;cursor:pointer}
.lb button:hover{background:rgba(238,243,242,.12)}
.lb svg{width:18px;height:18px}

/* contact */
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--rule)}
.contact>div{padding:24px 24px 24px 0;min-width:0}
.contact>div+div{padding-left:24px;border-left:1px solid var(--rule)}
.contact h3{font-size:1.2rem;margin-bottom:12px}
.copyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sel{user-select:all;-webkit-user-select:all;word-break:break-word}
.copy{padding:4px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);cursor:pointer;font:500 var(--t-xs) var(--f-mono);color:var(--muted)}
.copy:hover{border-color:var(--ink);color:var(--ink)}
.contact p{color:var(--muted)}
@media (max-width:820px){.contact{grid-template-columns:1fr}.contact>div+div{padding-left:0;border-left:0;border-top:1px solid var(--rule)}}
.links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}

/* invite band */
.invite{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:clamp(28px,4vw,44px);border:1px solid var(--ink);border-radius:6px;background:var(--surface)}
.invite h2{font-size:clamp(1.6rem,2.8vw,2.2rem)}
.invite p{margin-top:10px;color:var(--muted);max-width:40em}
@media (max-width:640px){.invite{grid-template-columns:1fr}}

/* footer */
.foot{border-top:1px solid var(--rule);padding-block:36px 44px;font-size:var(--t-sm);color:var(--muted)}
.foot-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.foot b{display:block;color:var(--ink);font:500 1.1rem var(--f-display);margin-bottom:4px}
.foot-id{display:flex;gap:16px;align-items:flex-start}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot nav a{color:var(--muted);text-decoration:none}
.foot nav a:hover{color:var(--ink)}
@media (max-width:700px){.foot-in{grid-template-columns:1fr}}
.more{margin-top:26px}

</style>

/* ---------- ambient polymer field (hero background) ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cssVar(el,n){return getComputedStyle(el).getPropertyValue(n).trim()||'#888'}

function ChainField({host}){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current; if(!cv) return; const ctx=cv.getContext('2d'); if(!ctx) return;
    const r=mulberry(1854);
    const chains=Array.from({length:18},()=>({x:r(),y:r(),a:r()*Math.PI*2,s:r()*100,n:34+Math.floor(r()*26),k:Array.from({length:60},()=>(r()-.5)*0.9),v:(r()-.5)*0.00004}));
    const rods=Array.from({length:26},()=>({x:r(),y:r(),a:r()*Math.PI,v:(r()-.5)*0.0002}));
    let W=0,H=0,dpr=1,raf=0,vis=true,last=0; const ptr={x:-1e4,y:-1e4};
    const size=()=>{const b=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=b.width;H=b.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
    const draw=t=>{
      ctx.clearRect(0,0,W,H);
      const ink=cssVar(document.documentElement,'--ink'), cu=cssVar(document.documentElement,'--copper');
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.strokeStyle=ink; ctx.globalAlpha=.09; ctx.lineWidth=1.3;
      const seg=Math.max(8,W/120);
      for(const c of chains){
        let x=((c.x+c.v*t)%1+1)%1*W, y=c.y*H, a=c.a;
        ctx.beginPath(); ctx.moveTo(x,y);
        for(let i=0;i<c.n;i++){
          a+=c.k[i]+0.22*Math.sin(t*0.0006+i*0.55+c.s);
          x+=Math.cos(a)*seg; y+=Math.sin(a)*seg;
          const dx=x-ptr.x, dy=y-ptr.y, d2=dx*dx+dy*dy;
          let px=x,py=y; if(d2<14400){const f=(1-d2/14400)*22/Math.sqrt(d2+1); px+=dx*f; py+=dy*f;}
          ctx.lineTo(px,py);
        }
        ctx.stroke();
      }
      ctx.strokeStyle=cu; ctx.globalAlpha=.2; ctx.lineWidth=1.8;
      const L=Math.max(26,W/34);
      for(const d of rods){
        const a=d.a+t*d.v, x=d.x*W, y=d.y*H;
        ctx.beginPath(); ctx.moveTo(x-Math.cos(a)*L/2,y-Math.sin(a)*L/2); ctx.lineTo(x+Math.cos(a)*L/2,y+Math.sin(a)*L/2); ctx.stroke();
      }
      ctx.globalAlpha=1;
    };
    const loop=t=>{ raf=requestAnimationFrame(loop); if(!vis||document.hidden) return; if(t-last<33) return; last=t; draw(t); };
    size(); draw(0);
    const ro=new ResizeObserver(()=>{size();draw(last)}); ro.observe(cv);
    const io=new IntersectionObserver(es=>{vis=es[0].isIntersecting}); io.observe(cv);
    const h=host&&host.current;
    const mv=e=>{const b=cv.getBoundingClientRect();ptr.x=e.clientX-b.left;ptr.y=e.clientY-b.top};
    const lv=()=>{ptr.x=-1e4;ptr.y=-1e4};
    if(h){h.addEventListener('pointermove',mv);h.addEventListener('pointerleave',lv)}
    const mo=new MutationObserver(()=>draw(last)); mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    if(!RM) raf=requestAnimationFrame(loop);
    return ()=>{cancelAnimationFrame(raf);ro.disconnect();io.disconnect();mo.disconnect();if(h){h.removeEventListener('pointermove',mv);h.removeEventListener('pointerleave',lv)}};
  },[]);
  return html`<canvas className="field" ref=${ref} aria-hidden="true"></canvas>`;
}

/* ---------- percolation model ---------- */
const PW=600, PH=380, PL=60, NMAX=1000, PER_WT=220, MAXWT=4.5;
function orient(ax,ay,bx,by,cx,cy){return (bx-ax)*(cy-ay)-(by-ay)*(cx-ax)}
function crosses(p,q){
  const d1=orient(p[0],p[1],p[2],p[3],q[0],q[1]), d2=orient(p[0],p[1],p[2],p[3],q[2],q[3]);
  const d3=orient(q[0],q[1],q[2],q[3],p[0],p[1]), d4=orient(q[0],q[1],q[2],q[3],p[2],p[3]);
  return d1*d2<0 && d3*d4<0;
}
function buildSample(seed){
  const r=mulberry(seed), rods=[];
  for(let i=0;i<NMAX;i++){const cx=r()*PW, cy=r()*PH, a=r()*Math.PI, dx=Math.cos(a)*PL/2, dy=Math.sin(a)*PL/2; rods.push([cx-dx,cy-dy,cx+dx,cy+dy]);}
  const adj=rods.map(()=>[]), grid=new Map(), key=(i,j)=>i+','+j, cell=s=>[Math.floor((s[0]+s[2])/2/PL),Math.floor((s[1]+s[3])/2/PL)];
  rods.forEach((s,i)=>{const [a,b]=cell(s),k=key(a,b); if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(i);});
  rods.forEach((s,i)=>{const [a,b]=cell(s);
    for(let u=-1;u<=1;u++) for(let v=-1;v<=1;v++){const L=grid.get(key(a+u,b+v)); if(!L) continue;
      for(const j of L){ if(j<=i) continue; if(crosses(s,rods[j])){adj[i].push(j);adj[j].push(i);} } } });
  const touchL=rods.map(s=>Math.min(s[0],s[2])<=0), touchR=rods.map(s=>Math.max(s[0],s[2])>=PW);
  const sample={rods,adj,touchL,touchR};
  // threshold: spanning is monotonic in N because rods are added in a fixed order
  let lo=0, hi=NMAX;
  if(!analyse(sample,NMAX).span){ sample.nc=null; } else { while(lo<hi){const m=(lo+hi)>>1; if(analyse(sample,m).span) hi=m; else lo=m+1;} sample.nc=lo; }
  return sample;
}
function analyse(S,N){
  const p=new Int32Array(N+2); for(let i=0;i<N+2;i++) p[i]=i;
  const f=x=>{while(p[x]!==x){p[x]=p[p[x]];x=p[x]}return x}, u=(a,b)=>{a=f(a);b=f(b);if(a!==b)p[a]=b};
  const L=N, R=N+1;
  for(let i=0;i<N;i++){ if(S.touchL[i]) u(i,L); if(S.touchR[i]) u(i,R); for(const j of S.adj[i]) if(j<i) u(i,j); }
  const span=N>0 && f(L)===f(R), root=f(L), size=new Map(); let largest=0;
  for(let i=0;i<N;i++){const k=f(i); const s=(size.get(k)||0)+1; size.set(k,s); if(s>largest) largest=s;}
  const on=new Uint8Array(N); if(span) for(let i=0;i<N;i++) if(f(i)===root) on[i]=1;
  return {span,on,largest,inNet:span?size.get(root):0};
}
const logSigma=(phi,pc)=> pc==null||phi<pc ? -13+0.6*Math.pow(phi/(pc||MAXWT),3) : Math.max(-12.4, Math.log10(100*Math.pow(phi-pc,2)+1e-13));

function Plot({phi,pc}){
  const W=340,H=210,l=44,r=10,t=12,b=34, x=v=>l+(v/MAXWT)*(W-l-r), y=v=>t+(3-v)/17*(H-t-b);
  let d=''; for(let i=0;i<=240;i++){const v=i/240*MAXWT; d+=(i?'L':'M')+x(v).toFixed(1)+','+y(logSigma(v,pc)).toFixed(1);}
  const yt=[-12,-8,-4,0];
  return html`<svg className="plot" viewBox=${'0 0 '+W+' '+H} role="img" aria-label=${'Conductivity against nanotube loading. Threshold near '+(pc==null?'n/a':pc.toFixed(2))+' wt%.'}>
    ${pc!=null && html`<rect className="cond" x=${x(pc)} y=${t} width=${x(MAXWT)-x(pc)} height=${H-t-b}/>`}
    ${yt.map(v=>html`<g key=${v}><line className="grid" x1=${l} x2=${W-r} y1=${y(v)} y2=${y(v)}/><text x=${l-6} y=${y(v)+3} textAnchor="end">${'10'}<tspan dy="-4" fontSize="8">${v}</tspan></text></g>`)}
    <line className="ax" x1=${l} x2=${W-r} y1=${H-b} y2=${H-b}/><line className="ax" x1=${l} x2=${l} y1=${t} y2=${H-b}/>
    ${[0,1,2,3,4].map(v=>html`<text key=${v} x=${x(v)} y=${H-b+14} textAnchor="middle">${v}</text>`)}
    <text x=${(l+W-r)/2} y=${H-4} textAnchor="middle">MWCNT loading (wt%)</text>
    <text transform=${'translate(10,'+((t+H-b)/2)+') rotate(-90)'} textAnchor="middle">σ (S/m)</text>
    ${pc!=null && html`<g><line className="pc" x1=${x(pc)} x2=${x(pc)} y1=${t} y2=${H-b}/><text className="pc-t" x=${x(pc)+5} y=${H-b-8}>${'φc ≈ '+pc.toFixed(2)+' wt%'}</text></g>`}
    <path className="curve" d=${d}/>
    <circle className="dot" cx=${x(phi)} cy=${y(logSigma(phi,pc))} r="5.5"/>
  </svg>`;
}

function Percolation(){
  const [seed,setSeed]=useState(2020);
  const [wt,setWt]=useState(0.9);
  const [sweep,setSweep]=useState(false);
  const S=useMemo(()=>buildSample(seed),[seed]);
  const N=Math.min(NMAX,Math.round(wt*PER_WT));
  const A=useMemo(()=>analyse(S,N),[S,N]);
  const pc=S.nc==null?null:S.nc/PER_WT;
  const cv=useRef(null), live=useRef({S,N,A});
  live.current={S,N,A};

  useEffect(()=>{
    const el=cv.current; if(!el) return; const ctx=el.getContext('2d'); if(!ctx) return;
    const pad=14, VW=PW+pad*2; let raf=0, vis=true;
    const draw=t=>{
      const {S,N,A}=live.current, root=document.documentElement;
      const ink=cssVar(root,'--ink'), mut=cssVar(root,'--muted'), cu=cssVar(root,'--copper'), tint=cssVar(root,'--tint'), surf=cssVar(root,'--surface');
      const b=el.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
      if(el.width!==Math.round(b.width*dpr)){el.width=Math.round(b.width*dpr); el.height=Math.round(b.width*dpr*PH/VW);}
      const s=el.width/VW; ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,el.width,el.height); ctx.setTransform(s,0,0,s,pad*s,0);
      ctx.fillStyle=tint; ctx.fillRect(0,0,PW,PH);
      ctx.fillStyle=cu; ctx.fillRect(-pad,0,pad-3,PH); ctx.fillRect(PW+3,0,pad-3,PH);
      ctx.save(); ctx.beginPath(); ctx.rect(0,0,PW,PH); ctx.clip(); ctx.lineCap='round';
      ctx.strokeStyle=mut; ctx.globalAlpha=.55; ctx.lineWidth=1.6; ctx.beginPath();
      for(let i=0;i<N;i++){ if(A.on[i]) continue; const r=S.rods[i]; ctx.moveTo(r[0],r[1]); ctx.lineTo(r[2],r[3]); }
      ctx.stroke(); ctx.globalAlpha=1;
      if(A.span){
        ctx.strokeStyle=cu; ctx.lineWidth=2.8; ctx.beginPath();
        for(let i=0;i<N;i++){ if(!A.on[i]) continue; const r=S.rods[i]; ctx.moveTo(r[0],r[1]); ctx.lineTo(r[2],r[3]); }
        ctx.stroke();
        if(!RM){ ctx.strokeStyle=surf; ctx.lineWidth=1.3; ctx.setLineDash([5,16]); ctx.lineDashOffset=-(t*0.05%21); ctx.stroke(); ctx.setLineDash([]); }
      }
      ctx.restore();
    };
    const loop=t=>{ raf=requestAnimationFrame(loop); if(!vis||document.hidden) return; draw(t); };
    const io=new IntersectionObserver(es=>{vis=es[0].isIntersecting}); io.observe(el);
    const ro=new ResizeObserver(()=>draw(performance.now())); ro.observe(el);
    const mo=new MutationObserver(()=>draw(performance.now())); mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    draw(0); if(!RM) raf=requestAnimationFrame(loop);
    el._redraw=draw;
    return ()=>{cancelAnimationFrame(raf);io.disconnect();ro.disconnect();mo.disconnect();};
  },[]);
  useEffect(()=>{ const el=cv.current; if(el&&el._redraw) el._redraw(performance.now()); },[S,N,A]);

  useEffect(()=>{
    if(!sweep) return; let raf=0, t0=0; const from=0, dur=7000;
    const step=t=>{ if(!t0)t0=t; const k=Math.min(1,(t-t0)/dur); setWt(+(from+k*MAXWT).toFixed(2)); if(k<1) raf=requestAnimationFrame(step); else setSweep(false); };
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf);
  },[sweep]);

  return html`<div className="lab">
    <div className="lab-stage">
      <canvas ref=${cv} role="img" aria-label=${N+' nanotubes in an insulating matrix. '+(A.span?'A connected network joins the electrodes.':'No connected path between the electrodes.')}></canvas>
      <div className="stage-labels"><span>Electrode</span><span className="mid">Polymer matrix with dispersed MWCNTs</span><span>Electrode</span></div>
    </div>
    <div className="lab-side">
      <span className=${'state'+(A.span?' on':'')} aria-live="polite"><i></i>${A.span?'Conducting network formed':'Insulating'}</span>
      <dl className="readout">
        <div><dt>Nanotubes</dt><dd>${N}</dd></div>
        <div><dt>Largest cluster</dt><dd>${A.largest}</dd></div>
        <div><dt>In network</dt><dd>${A.inNet}</dd></div>
      </dl>
      <div className="slider">
        <label htmlFor="loading">MWCNT loading <span>${wt.toFixed(2)} wt%</span></label>
        <input id="loading" type="range" min="0" max=${MAXWT} step="0.01" value=${wt} onInput=${e=>{setSweep(false);setWt(+e.target.value)}}/>
      </div>
      <div className="ctrl">
        <button className="btn solid" onClick=${()=>{setWt(0);setSweep(true)}} disabled=${sweep}>${sweep?'Sweeping…':'Run a loading sweep'}</button>
        <button className="btn" onClick=${()=>{setSweep(false);setSeed(s=>s+1)}}>New sample</button>
      </div>
      <${Plot} phi=${wt} pc=${pc}/>
    </div>
    <p className="lab-note">An illustrative two-dimensional model: nanotubes are dropped at random into an insulating matrix, in the same order every time for a given sample. Below the percolation threshold φc the clusters stay isolated and the composite insulates. At φc one cluster first touches both electrodes, and conductivity rises by many orders of magnitude, following σ ∝ (φ − φc)<sup>t</sup> with t = 2. The same transition governs her measurements of electrical conductivity and EMI shielding in <a href="https://doi.org/10.1007/s10854-020-04359-x" target="_blank" rel="noopener">PEK/MWCNT nanocomposites</a>.</p>
  </div>`;
}

function Record({pubs,year,setYear}){
  const ys=pubs.map(p=>+p.y), y0=Math.min(...ys,2006), y1=Math.max(...ys,new Date().getFullYear());
  const years=[]; for(let y=y0;y<=y1;y++) years.push(y);
  const by={}; pubs.forEach(p=>{(by[p.y]=by[p.y]||[]).push(p)});
  const maxN=Math.max(1,...Object.values(by).map(a=>a.length));
  const cw=30, l=8, W=l*2+years.length*cw, R=6, gap=15, H=24+maxN*gap+10;
  return html`<div className="record">
    <svg viewBox=${'0 0 '+W+' '+H} role="img" aria-label="Publications per year">
      ${years.map((y,k)=>{ const x=l+k*cw, list=by[y]||[];
        return html`<g key=${y} onClick=${()=>list.length&&setYear(year===y?null:y)}>
          <rect className=${'col'+(year===y?' sel':'')} x=${x+1} y="0" width=${cw-2} height=${H-18} rx="3"/>
          ${list.map((p,j)=>html`<circle key=${j} className=${'d-'+p.k} cx=${x+cw/2} cy=${H-26-j*gap} r=${R}/>`)}
          ${(y%2===0||list.length>0) && html`<text x=${x+cw/2} y=${H-4} textAnchor="middle">${"'"+String(y).slice(2)}</text>`}
        </g>`;})}
      <line className="ax" x1=${l} x2=${W-l} y1=${H-17} y2=${H-17}/>
    </svg>
    <div className="record-key"><span className="kind"><i className="k-Journal"></i>Journal</span><span className="kind"><i className="k-Conference"></i>Conference</span><span className="kind"><i className="k-Chapter"></i>Book chapter</span><span>Select a year to filter</span></div>
  </div>`;
}
function Publications(){
  const {c}=useSite(); const [q,setQ]=useState(''); const [kind,setKind]=useState('All'); const [year,setYear]=useState(null);
  const list=useMemo(()=>[...c.pubs].sort((a,b)=>b.y-a.y).filter(p=>(kind==='All'||p.k===kind)&&(year==null||+p.y===year)&&(p.t+' '+p.a+' '+p.j).toLowerCase().includes(q.toLowerCase())),[c.pubs,q,kind,year]);
  const count=k=>k==='All'?c.pubs.length:c.pubs.filter(p=>p.k===k).length;
  return html`<div className="page">
    <${PageHead} title="Publications" lede=${c.pubs.length+' journal articles, conference papers and book chapters, from batch annealing of steel in 2006 to radar-absorbing nanocomposites in 2026.'}/>
    <section className="section"><div className="wrap">
      <${Record} pubs=${c.pubs} year=${year} setYear=${setYear}/>
      <div className="tools">
        <label className="search"><span className="sr">Search publications</span><${Icon} n="search"/><input id="pub-search" value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Search by title, co-author or journal"/></label>
        <div className="chips">${['All','Journal','Conference','Chapter'].map(k=>html`<button key=${k} className="chip" aria-pressed=${kind===k} onClick=${()=>setKind(k)}>${k}<small>${count(k)}</small></button>`)}</div>
        ${year!=null && html`<button className="chip" aria-pressed="true" onClick=${()=>setYear(null)}>${year} ×</button>`}
      </div>
      ${list.length? html`<ul className="pubs">${list.map((p,i)=>html`<${PubItem} key=${p.t+i} p=${p}/>`)}</ul>`
        : html`<div className="empty"><b>No publications match</b>Try a different word, or clear the type and year filters.</div>`}

  </div>`;
}

function Copy({text}){
  const [ok,setOk]=useState(false); const ref=useRef(null);
  const select=()=>{try{const r=document.createRange();r.selectNodeContents(ref.current);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}};
  const go=()=>{ const done=()=>{setOk(true);setTimeout(()=>setOk(false),1500)};
    try{ navigator.clipboard.writeText(text).then(done,select); }catch(e){ select(); } };
  return html`<span className="copyrow"><span className="sel" ref=${ref}>${text}</span><button className="copy" onClick=${go}>${ok?'Copied':'Copy'}</button></span>`;
}

/* ---------- shell ---------- */
const IDS=ROUTES.map(r=>r[0]);
const readRoute=()=>{const h=location.hash.replace(/^#\/?/,''); return IDS.includes(h)?h:'home';};
function useRoute(){
  const [r,setR]=useState(readRoute());
  useEffect(()=>{const f=()=>{setR(readRoute());window.scrollTo(0,0)}; addEventListener('hashchange',f); return ()=>removeEventListener('hashchange',f)},[]);
  return r;
}
function Nav({route,dark,toggle}){
  const [open,setOpen]=useState(false);
  useEffect(()=>setOpen(false),[route]);
  return html`<nav className="nav" aria-label="Main"><div className="wrap nav-in">
    <a className="mark" href="#home" aria-label="Home">MGK</a>
    <div className="nav-name"><b>Dr Manisha G. Kulthe</b><span>Metallurgy and Materials Engineering, COEP Tech</span></div>
    <ul id="nav-links" className=${'nav-links'+(open?' open':'')}>
      ${ROUTES.map(([id,l])=>html`<li key=${id}><a href=${'#'+id} aria-current=${route===id?'page':undefined}>${l}</a></li>`)}
    </ul>
    <button className="icon-btn" onClick=${toggle} aria-label=${dark?'Use light theme':'Use dark theme'}><${Icon} n=${dark?'sun':'moon'}/></button>
    <button className="icon-btn menu-btn" aria-expanded=${open} aria-controls="nav-links" aria-label="Menu" onClick=${()=>setOpen(!open)}><${Icon} n=${open?'x':'menu'}/></button>
  </div></nav>`;
}
function Footer(){
  return html`<footer className="foot"><div className="wrap foot-in">
    <div className="foot-id"><span className="logo-plate lg"><img src="images/coep-logo.png" alt="COEP Technological University crest"/></span><div><b>Dr Manisha G. Kulthe</b>Department of Metallurgy and Materials Engineering<br/>COEP Technological University, a unitary public university of the Government of Maharashtra (formerly College of Engineering Pune)</div></div>
    <nav aria-label="Footer">${ROUTES.slice(1).map(([id,l])=>html`<a key=${id} href=${'#'+id}>${l}</a>`)}</nav>
  </div></footer>`;
}
function useTheme(){
  const sys=()=>!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const [pick,setPick]=useState(()=>{try{return localStorage.getItem('mgk-theme')}catch(e){return null}});
  const [sd,setSd]=useState(sys());
  useEffect(()=>{ if(!window.matchMedia) return; const m=matchMedia('(prefers-color-scheme: dark)'); const f=()=>setSd(m.matches); m.addEventListener&&m.addEventListener('change',f); return ()=>m.removeEventListener&&m.removeEventListener('change',f); },[]);
  useEffect(()=>{ if(pick) document.documentElement.setAttribute('data-theme',pick); },[pick]);
  const dark=pick?pick==='dark':sd;
  const toggle=()=>{const v=dark?'light':'dark'; setPick(v); try{localStorage.setItem('mgk-theme',v)}catch(e){}};
  return {dark,toggle};
}
function App(){
  const route=useRoute(); const {dark,toggle}=useTheme();
  const [c,setC]=useState(SEED);
  useEffect(()=>{ let dead=false;
    fetch('content/site.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&!dead) setC(x=>({...x,...j})); }).catch(()=>{});
    return ()=>{dead=true}; },[]);
  useEffect(()=>{ const t=ROUTES.find(r=>r[0]===route)[1]; document.title=(route==='home'?'':t+' · ')+'Dr Manisha G. Kulthe'; },[route]);
  const Page={home:Home,research:Research,publications:Publications,projects:Projects,gallery:Gallery,profile:Profile,awards:Awards,contact:Contact}[route];
  return html`<${Ctx.Provider} value=${{c}}>
    <${Masthead}/>
    <${Nav} route=${route} dark=${dark} toggle=${toggle}/>
    <main key=${route}><${Page}/></main>
    <${Footer}/>
  </${Ctx.Provider}>`;
}
window.__MGK={App,html,buildSample,analyse,logSigma};
if(!window.__NO_MOUNT) ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
